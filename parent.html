<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daily Reads — Parent</title>
<link rel="stylesheet" href="style.css">
<style>
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .tile b{display:block;font-size:1.6rem;line-height:1.1}
  .tile span{font-size:.8rem;color:var(--muted)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%}
  .ok{color:var(--good)} .lo{color:var(--bad)} .mid{color:var(--warn)}
  .flag{font-size:.75rem;padding:1px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
  .missed{color:var(--muted);font-style:italic}
  input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
  blockquote{margin:6px 0 0;padding-left:10px;border-left:3px solid var(--line);color:var(--ink);white-space:pre-wrap}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<main id="app"><p class="muted pad">Loading…</p></main>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  const CFG = window.APP_CONFIG || {}, TARGET = CFG.TARGET_MINUTES || 20;
  const app = document.getElementById("app");
  const ls = { get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = (()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
  const nice = s => { const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); };
  const cls = p => p>=80?"ok":p>=60?"mid":"lo";
  const barCol = p => p>=80?"var(--good)":p>=60?"var(--warn)":"var(--bad)";

  // Allow ?key=... once, then remember it on this device.
  const qk = new URLSearchParams(location.search).get("key");
  if (qk) { ls.set("readKey", qk); history.replaceState(null,"",location.pathname); }

  function askKey(msg){
    app.innerHTML = '<h1>Parent dashboard</h1>'+(msg?'<div class="banner">'+esc(msg)+'</div>':'')+
      '<div class="card"><label>Read key (from Code.gs)<input id="k" type="password" autocomplete="off"></label>'+
      (CFG.SCRIPT_URL?'':'<label style="display:block;margin-top:10px">Apps Script URL<input id="u" placeholder="https://script.google.com/macros/s/…/exec"></label>')+
      '<button class="btn" id="go">Open</button></div>';
    document.getElementById("go").onclick=()=>{ ls.set("readKey",document.getElementById("k").value.trim()); const u=document.getElementById("u"); if(u) ls.set("scriptUrl",u.value.trim()); load(); };
  }

  async function load(){
    const url = CFG.SCRIPT_URL || ls.get("scriptUrl"), key = ls.get("readKey");
    if (!url || !key) return askKey();
    app.innerHTML = '<p class="muted pad">Fetching results…</p>';
    let data, pack=null;
    try {
      const r = await fetch(url+"?key="+encodeURIComponent(key));
      data = await r.json();
    } catch(e){ return askKey("Couldn't reach the Google Sheet — check the URL and your connection."); }
    if (!data.ok) return askKey("That key wasn't accepted.");
    try { const r = await fetch("content/week.json",{cache:"no-store"}); if(r.ok) pack = await r.json(); } catch(e){}
    render(data, pack);
  }

  function render(data, pack){
    const sessions = data.sessions||[], answers = data.answers||[];
    const byId = {}; sessions.forEach(s=>byId[s.sessionId]=s);
    const planned = []; if (pack) (pack.days||[]).forEach(d=>(d.sessions||[]).forEach(s=>planned.push(Object.assign({date:d.date},s))));
    const wk = planned.map(p=>byId[p.id]).filter(Boolean);
    const due = planned.filter(p=>p.date<=today);
    const avgPct = wk.length? Math.round(wk.reduce((a,s)=>a+Number(s.pct||0),0)/wk.length):null;
    const avgMin = wk.length? Math.round(wk.reduce((a,s)=>a+Number(s.activeMin||0),0)/wk.length):null;
    const totMin = Math.round(wk.reduce((a,s)=>a+Number(s.activeMin||0),0));

    let h = '<div class="topbar"><h1>Daily Reads</h1><button class="link" id="refresh">Refresh</button></div>';
    h += '<p class="muted">'+(pack?esc(pack.title||"This week")+' · week of '+esc(nice(pack.week||planned[0]?.date||today)):"No content pack found")+'</p>';
    h += '<div class="tiles">'+
      tile(wk.length+"/"+due.length, "sessions done (so far)")+
      tile(avgPct==null?"–":avgPct+"%", "average score")+
      tile(avgMin==null?"–":avgMin+" min", "average per session (target "+TARGET+")")+
      tile(totMin+" min", "total this week")+'</div>';

    // This week's schedule
    if (planned.length){
      h += '<h2>This week</h2><div class="card scroll"><table><tr><th>Day</th><th>Topic</th><th class="num">Score</th><th class="num">Min</th></tr>';
      planned.forEach(p=>{
        const s = byId[p.id];
        if (s) h += '<tr><td>'+esc(nice(p.date))+'<div class="small muted">'+esc(p.slot||"")+'</div></td><td><span class="pill '+esc(p.subject)+'">'+esc(p.subject)+'</span>'+esc(p.topic)+
          (Number(s.awayCount)>3?' <span class="flag">left app '+esc(s.awayCount)+'×</span>':'')+'</td><td class="num '+cls(s.pct)+'">'+esc(s.score)+'/'+esc(s.total)+'</td><td class="num">'+
          esc(Math.round(s.activeMin))+(Number(s.activeMin)<TARGET?' <span class="flag">short</span>':'')+'</td></tr>';
        else h += '<tr><td>'+esc(nice(p.date))+'<div class="small muted">'+esc(p.slot||"")+'</div></td><td><span class="pill '+esc(p.subject)+'">'+esc(p.subject)+'</span>'+esc(p.topic)+'</td><td class="num missed" colspan="2">'+(p.date<today?"not done":p.date===today?"today":"upcoming")+'</td></tr>';
      });
      h += '</table></div>';
    }

    // Weak spots: by tag, last 28 days
    const cutoff = new Date(Date.now()-28*864e5).toISOString().slice(0,10);
    const tags = {};
    answers.filter(a=>String(a.date).slice(0,10)>=cutoff && a.tag).forEach(a=>{
      const k=a.subject+"|"+a.tag; tags[k]=tags[k]||{subject:a.subject,tag:a.tag,n:0,ok:0}; tags[k].n++; if(a.ok===true||a.ok==="TRUE") tags[k].ok++; });
    const tagList = Object.values(tags).filter(t=>t.n>=2).map(t=>Object.assign(t,{pct:Math.round(100*t.ok/t.n)})).sort((a,b)=>a.pct-b.pct);
    if (tagList.length){
      h += '<h2>Strong and weak spots <span class="small muted">(last 4 weeks)</span></h2><div class="card"><table>';
      tagList.forEach(t=>h+='<tr><td><span class="pill '+esc(t.subject)+'">'+esc(t.subject)+'</span>'+esc(t.tag)+'</td><td style="width:35%"><div class="bar"><i style="width:'+t.pct+'%;background:'+barCol(t.pct)+'"></i></div></td><td class="num '+cls(t.pct)+'">'+t.ok+'/'+t.n+'</td></tr>');
      h += '</table></div>';
    }

    // Subject trend by week
    const subj = {};
    sessions.forEach(s=>{ const k=s.subject; subj[k]=subj[k]||{}; const w=s.week||String(s.date).slice(0,10); subj[k][w]=subj[k][w]||[]; subj[k][w].push(Number(s.pct||0)); });
    if (Object.keys(subj).length){
      h += '<h2>By subject, week by week</h2><div class="card scroll"><table><tr><th>Subject</th><th>Weekly average</th></tr>';
      Object.keys(subj).sort().forEach(k=>{ const ws=Object.keys(subj[k]).sort().slice(-8);
        h+='<tr><td><span class="pill '+esc(k)+'">'+esc(k)+'</span></td><td>'+ws.map(w=>{const v=subj[k][w];const p=Math.round(v.reduce((a,b)=>a+b,0)/v.length);return '<span class="'+cls(p)+'" title="'+esc(w)+'">'+p+'%</span>';}).join(" → ")+'</td></tr>'; });
      h += '</table></div>';
    }

    // Reflections
    const refl = wk.filter(s=>String(s.reflection||"").trim());
    if (refl.length){
      h += '<h2>In her own words</h2>'+refl.map(s=>'<div class="card"><div class="small muted">'+esc(nice(s.date))+' · '+esc(s.topic)+'</div><blockquote>'+esc(s.reflection)+'</blockquote></div>').join("");
    }

    h += '<h2>Weekend planning</h2><div class="card"><p style="margin-top:0">Copies a compact summary you can paste into Claude when you plan next week.</p><button class="btn" id="copy">Copy summary for Claude</button></div>';
    h += '<p class="small muted"><button class="link" id="forget">Forget key on this device</button></p>';
    app.innerHTML = h;

    document.getElementById("refresh").onclick = load;
    document.getElementById("forget").onclick = ()=>{ ls.set("readKey",""); askKey(); };
    document.getElementById("copy").onclick = async (e)=>{
      const missed = planned.filter(p=>p.date<today && !byId[p.id]).map(p=>p.id);
      const wrong = answers.filter(a=>planned.some(p=>p.id===a.sessionId) && !(a.ok===true||a.ok==="TRUE")).map(a=>({s:a.sessionId,tag:a.tag,q:a.question,chose:a.chosen,correct:a.correct}));
      const txt = "Daily Reads summary — "+(pack&&pack.week||"")+"\n"+JSON.stringify({
        sessions: wk.map(s=>({id:s.sessionId,subject:s.subject,topic:s.topic,score:s.score+"/"+s.total,min:s.activeMin,away:s.awayCount,reflection:s.reflection})),
        missed, weakTags: tagList.filter(t=>t.pct<70).map(t=>t.subject+": "+t.tag+" "+t.ok+"/"+t.n), wrongAnswers: wrong }, null, 1);
      try { await navigator.clipboard.writeText(txt); e.target.textContent="Copied ✓"; } catch(err){ prompt("Copy this:", txt); }
    };
  }
  function tile(b,s){ return '<div class="tile"><b>'+esc(b)+'</b><span>'+esc(s)+'</span></div>'; }
  load();
})();
</script>
</body>
</html>
